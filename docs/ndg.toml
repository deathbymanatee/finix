footer_text = "Generated with ndg"
jobs = 4

# Enable features
highlight_code = true
generate_anchors = true

# Code block handling
# tab_style = "normalize"  # converts tabs to spaces
# syntax_queries_path = "queries" # expects '<lang>/{highlights,injections,locals}.scm'

# Custom assets
# stylesheet_paths = ["custom.css"]
# script_paths = ["analytics.js"]

# Git integration
revision = "main"

[markdown]
extensions = ["math-dollars", "math-code", "math-latex"]

[sidebar]
number_special_files = true
numbered = true
ordering = "custom"

[[sidebar.matches]]
new_title = "Introduction"
path = "inputs/index.md"
position = 1

[[sidebar.matches]]
new_title = "Frequenty Asked Questions"
path = "inputs/FAQ.md"
position = 2

[[sidebar.matches]]
new_title = "Installation"
path = "inputs/installation.md"
position = 3

[[sidebar.matches]]
new_title = "Comparing finix and NixOS"
path = "inputs/finix-vs-nixos.md"
position = 4

